spring.application.name=testHibernate
server.port=6066
spring.main.banner-mode=off
# ===============================
# MySQL Database Connection
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/testdb
spring.datasource.username=root
spring.datasource.password=3306
# (O P T I O N A L)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Always run schema.sql and data.sql (required for MySQL, PostgreSQL, etc.)
spring.sql.init.mode=always

# Ensure data.sql runs AFTER Hibernate creates the tables (if using JPA)
spring.jpa.defer-datasource-initialization=true

