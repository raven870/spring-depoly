spring.application.name=testHibernate
server.port=${SERVER_PORT:6066}
spring.main.banner-mode=off

# ===============================
# MySQL Database Connection
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Settings
# ===============================
# Warning: 'create' drops and recreates tables on every restart! Use 'update' or 'validate' in production.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Always run schema.sql and data.sql
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# Ensure data.sql runs AFTER Hibernate creates the tables (if using JPA)
spring.jpa.defer-datasource-initialization=true

# =====================================
# JWT
# =====================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}